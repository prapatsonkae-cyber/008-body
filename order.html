<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="rule">
      </div>
    </section>

    <section class="container-narrow" style="padding-bottom: var(--space-6);">
      <form id="orderForm" class="form-card">

        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" required>
        </div>

        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" inputmode="numeric" required>
        </div>

        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note"></textarea>
        </div>

        <button type="submit" class="btn btn-accent">ยืนยันสั่งซื้อ</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p style="margin:0 auto;">&copy; Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
